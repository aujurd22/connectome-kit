[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-kit"
version = "0.1.0"
description = "Analysis toolkit for large connectomes (built and validated on the Drosophila BANC whole-CNS connectome, 169k neurons / 13.6M synapses)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junrong Du" }]
keywords = ["connectome", "neuroscience", "network-analysis", "drosophila", "graph"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "networkx>=3.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
plot = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["connectome_kit*"]
